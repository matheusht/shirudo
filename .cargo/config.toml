#
# The crates rust/Cargo.lock pins come from rust/vendor, so that cargo
# builds offline; `cargo vendor --manifest-path rust/Cargo.toml
# rust/vendor` refreshes them.

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "rust/vendor"
